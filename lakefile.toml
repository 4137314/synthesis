name = "synthesis"
version = "0.4.0"
defaultTargets = ["Synthesis", "SynthesisDomains", "SynthesisBridges", "SynthesisTests", "synthesis_tests"]
testDriver = "synthesis_tests"

[leanOptions]
warningAsError = true

[[lean_lib]]
name = "Synthesis"

[[lean_exe]]
name = "synthesis_tests"
root = "Tests.Main"

[[lean_lib]]
name = "SynthesisTests"
roots = ["Tests.Formal", "Tests.Engineering", "Tests.RealElectronics", "Tests.Electronics"]

[[lean_lib]]
name = "SynthesisDomains"
roots = ["Synthesis.Domains"]

[[lean_lib]]
name = "SynthesisBridges"
roots = ["Synthesis.Bridges"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "905b95818eb32af7874a58b427f50c1711a5e96c"
